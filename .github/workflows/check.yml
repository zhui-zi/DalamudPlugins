name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/dalamud-unlock/package-lock.json
      - run: npm ci --prefix workers/dalamud-unlock
      - shell: pwsh
        run: ./scripts/verify.ps1 -SkipNpmInstall
